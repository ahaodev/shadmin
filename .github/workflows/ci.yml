name: CI

on:
  push:
    branches: [ main , oidc ]
    tags:
      - 'v*'
    paths: &trigger_paths
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cli/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'frontend/**'
      - 'ent/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths: *trigger_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend format check
        working-directory: frontend
        run: pnpm format:check

      - name: Frontend session tests
        working-directory: frontend
        run: pnpm test

      - name: Frontend build
        working-directory: frontend
        run: pnpm build

      - name: Download Go dependencies
        run: go mod download

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Generate code (ent & swagger)
        run: go generate ./...

      - name: Verify committed swagger docs match annotations
        run: git diff --exit-code -- docs

      - name: Go fmt check
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "Files not formatted:"
            echo "$DIFF"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v ./...

      - name: CLI vet and tests
        working-directory: cli
        run: go vet ./... && go test -race ./...

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shadmin_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: shadmin_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-retries 30
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go generate ./ent
      - name: PostgreSQL authorization transactions
        run: go test -race ./repository
        env:
          SHADMIN_TEST_DB_DRIVER: postgres
          SHADMIN_TEST_DB_DSN: postgres://postgres:test@localhost:5432/shadmin_test?sslmode=disable
      - name: MySQL authorization transactions
        run: go test -race ./repository
        env:
          SHADMIN_TEST_DB_DRIVER: mysql
          SHADMIN_TEST_DB_DSN: root:test@tcp(localhost:3306)/shadmin_test?parseTime=true
      - name: Redis atomic token consumption
        run: go test -race ./internal/auth -run TestTokenConsumption
        env:
          SHADMIN_TEST_REDIS: localhost:6379

  release:
    runs-on: ubuntu-latest
    needs: [ check, database ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
